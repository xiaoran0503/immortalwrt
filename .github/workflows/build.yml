name: build-x86-64-pve

on:
  schedule:
    # 每周一 02:00 (Asia/Shanghai) = 每周日 18:00 UTC
    - cron: '0 18 * * 0'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'package/immortalwrt-custom/**'
      - 'package/luci-app-netwizard/**'
      - 'package/luci-app-ikuai/**'

concurrency:
  group: build-x86-64-pve
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # ccache 目录必须固定，且与 .config 里的 CONFIG_CCACHE_DIR 完全一致，
  # 否则每次构建都在一个空目录里编译，缓存永远命不中。
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步上游 ImmortalWrt
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git fetch --no-tags upstream master
          git log --oneline -1 upstream/master
          if git merge --no-edit upstream/master; then
            echo "上游合并成功"
          else
            echo "::error::合并上游冲突，需要人工处理"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push origin master && echo "已推送同步结果" || echo "无新提交"

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/graalvm /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig zlib1g-dev unzip zip qemu-utils ccache

      - name: 缓存源码下载目录
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ github.run_number }}
          restore-keys: |
            dl-

      # ccache 复用上一次的编译产物。首次是冷缓存，从第二次构建起命中，
      # 上游代码没变的包直接跳过编译，能把两小时压到一小时以内。
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        run: |
          cat > .config <<'CONFIG_EOF'
          # ---- 目标平台：x86-64 通用（PVE / KVM 虚拟机）----
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # ---- 编译加速：ccache ----
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="/home/runner/.ccache"
          CONFIG_CCACHE_COMPRESS=y
          CONFIG_CCACHE_MAXSIZE="4G"

          # ---- 基础 LuCI ----
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y

          # ---- 主题：Argon ----
          CONFIG_PACKAGE_luci-theme-argon=y

          # ---- 中文化 ----
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-commands-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          # ---- PassWall 及内核 ----
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y

          # ---- IPv6 全套 ----
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_IPV6=y

          # ---- PVE 虚拟化 ----
          # 包名是 qemu-ga（TITLE: QEMU Guest Agent），不是 qemu-guest-agent。
          # PVE 侧还需要在虚拟机选项里把 QEMU Guest Agent 打开，才会显示 IP。
          CONFIG_PACKAGE_qemu-ga=y

          # ---- 本仓库自制包 ----
          CONFIG_PACKAGE_immortalwrt-custom=y
          CONFIG_PACKAGE_luci-app-netwizard=y
          CONFIG_PACKAGE_luci-app-ikuai=y
          CONFIG_EOF
          make defconfig

      - name: 校验关键软件包已进入配置
        run: |
          set -e
          missing=0
          for p in luci-theme-argon luci-app-passwall luci-app-netwizard luci-app-ikuai \
                   immortalwrt-custom xray-core sing-box odhcp6c qemu-ga; do
            if grep -q "^CONFIG_PACKAGE_$p=y$" .config; then
              echo "OK   $p"
            elif grep -q "^# CONFIG_PACKAGE_$p is not set$" .config; then
              echo "::error::包未被选中: $p"; missing=1
            else
              echo "::warning::配置里没有该包条目(可能包名不同): $p"
            fi
          done
          [ $missing -eq 0 ] || { echo "存在关键包缺失，终止编译"; exit 1; }

      # 这组信息会写进 Release 说明：以后回看某一版固件时，
      # 能立刻对上"它编的是上游哪个提交、哪天出的"，不用翻 Actions 记录。
      - name: 记录构建元信息
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short upstream/master)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: 编译固件
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
        # 失败时保留下面的日志 artifact 便于排查

      - name: 转换为 qcow2
        run: |
          set -e
          mkdir -p out
          T=bin/targets/x86/64
          ls -1 "$T" || true
          for f in "$T"/*combined*.img.gz; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .img.gz)
            echo "转换 $base"
            gunzip -c "$f" > /tmp/disk.img
            qemu-img convert -f raw -O qcow2 -o cluster_size=4096 \
              /tmp/disk.img "out/immortalwrt-x86-64-pve-${base}.qcow2"
            rm -f /tmp/disk.img
          done
          cd out && sha256sum *.qcow2 > SHA256SUMS.txt && ls -lh

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      # artifact 只留 14 天，Release 要长期可查，所以另压一份放进附件，
      # 排障时不用回来翻已经过期的 artifact。
      - name: 打包编译日志
        if: always()
        run: |
          mkdir -p out
          if [ -f build.log ]; then gzip -9 -c build.log > out/build.log.gz; fi

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pve-${{ github.run_number }}-${{ github.run_attempt }}
          # 注意引号：不加引号时 "#" 前面有空格会被 YAML 当成注释，编号就丢了
          name: "ImmortalWrt x86-64 PVE 固件 #${{ github.run_number }}"
          files: |
            out/*.qcow2
            out/SHA256SUMS.txt
            out/build.log.gz
          body: |
            ## ImmortalWrt x86-64 · PVE / KVM

            构建时间 `${{ steps.meta.outputs.date }}`（Asia/Shanghai）
            本仓库提交 `${{ steps.meta.outputs.commit }}`　上游提交 `${{ steps.meta.outputs.upstream }}`

            ### 默认形态：旁路由，不接管 DHCP

            开机即是一台旁路由，**不跑 DHCP、也不发 IPv6 RA**，不会和主路由抢地址。

            | 项 | 默认值 |
            |---|---|
            | 后台地址 | `http://192.168.3.19` |
            | 网关 / DNS | `192.168.3.1`（指回主路由，旁路由自己才能上网） |
            | DHCP 服务 | 已关闭 |
            | IPv6 RA / DHCPv6 | 已关闭（否则终端会拿到两个 IPv6 网关） |
            | 流量卸载 | nftables 软件 offload 已开 |

            **要让终端走这台旁路由**，把网关指向 `192.168.3.19` —— 在爱快「DHCP 设置」里改下发的网关最快，不用逐台改终端。

            > 主路由若不是 `192.168.3.1`，进后台「网络 → 接口 → LAN」改网关和 DNS 两项。

            ### 预装内容

            - **PassWall**，含 xray-core 与 sing-box 双内核
            - **Argon 主题 + 简体中文**，开箱即用
            - **仿爱快风格总览首页**，默认进入；右上角「原生界面 ↗」随时回原版 LuCI 调高级参数
            - **qemu-ga**：PVE 里还需在虚拟机「选项 → QEMU Guest Agent」勾选，面板才显示 IP
            - **网络向导**：一键切换主路由 / 旁路由 / PPPoE 拨号
            - IPv6 全套（odhcp6c + odhcpd-ipv6only）

            ### 部署到 PVE

            ```bash
            qm importdisk <vmid> <qcow2 文件> <存储名>
            qm set <vmid> --scsi0 <存储名>:vm-<vmid>-disk-0
            qm set <vmid> --boot c --bootdisk scsi0
            qm set <vmid> --serial0 socket --vga serial0
            qm set <vmid> --onboot 1
            ```

            ### 排障

            附件 `build.log.gz` 是本次编译的完整日志，编译出问题先看它。
            Actions 里另有同名 artifact，但只保留 14 天。
